- name: Scheduled Tasks and Services Configuration
  hosts: application_server
  gather_facts: no
  tasks:
    - include_tasks: 'path/to/vars/main.yml'
    
    - name: 'actions | Update Local Security Policy to allow users to run scheduled tasks'
      win_user_right:
        name: SeBatchLogonRight
        users:
        - '{{ account.service.domain }}\{{ account.service.user }}'
        action: add
        
    - name: 'actions | Collect all tasks launched by user and update the credentials'
      win_shell: Get-ScheduledTask | Where-Object { $_.Principal.UserId -eq '{{ account.service.user }}'} | Set-ScheduledTask -User '{{ account.service.user }}' -Password '{{ account.service.pwd }}'
      
    - name: 'actions | Update Local Security Policy to allow users to logon'
      win_user_right:
        name: SeServiceLogonRight
        users:
        - '{{ account.service.domain }}\{{ account.service.user }}'
        action: add  
        
    - name: 'actions | Collect all services launched by user and update the credentials'
      win_shell: Get-WmiObject Win32_Service | where-object {$_.startname -eq "{{ account.service.domain }}\{{ account.service.user }}"} | ForEach-Object { $_.change($null, $null, $null, $null, $null, $null,$null, "{{ account.service.pwd }}", $null, $null, $null) }
